# Per-pass budget caps for blog-5-audit-existing.
# If a pass would exceed any cap, abort and flag for manual review.
internal_links_max: 12   # bumped 4->12 (SEO audit 2026-05-24): inline siblings + course links + Related-Articles block
images_max: 3
freshness_edits_max: 10

# External link checking
http_timeout_ms: 8000
http_max_redirects: 5
http_retries: 2

# Internal link relevance scoring
relevance_min_score: 0.35  # tune during dogfooding
relevance_weights:
  shared_tag: 0.4
  title_keyword_overlap: 0.3
  h2_keyword_overlap: 0.2
  same_pillar: 0.1

# Image targets
words_per_image: 400
require_above_fold_image: true

# Triage scoring weights (triage.py)
# score = audit*errors + link_gap*gap + freshness*(days/30) + gsc*gsc_score
triage_weights:
  audit: 3.0       # per failed error check
  link_gap: 2.0    # per missing internal sibling link
  freshness: 1.0   # multiplied by days_since_improved/30
  gsc: 1.0         # multiplied by striking-distance + slip count

# Sitemaps to crawl for course-page candidates
external_sitemaps:
  - https://www.intellisoft.com.sg/sitemap.xml
  - https://www.trainingint.com/sitemap.xml
