sites:
  intellisoft:
    base_url: https://www.intellisoft.com.sg
    gsc_property: https://www.intellisoft.com.sg/
    wp_api_base: https://www.intellisoft.com.sg/wp-json/wp/v2
    ae_api_base: https://www.intellisoft.com.sg/wp-json/ae/v1
    app_password_env: WP_INTELLISOFT
    cadence:
      per_week: 5
      days:
      - Mon
      - Tue
      - Wed
      - Thu
      - Fri
    link_budget:
      internal_sibling_min: 2
      internal_sibling_max: 3
      primary_course_distinct: 1
      primary_course_occurrences_max: 3
      secondary_course_max: 3
      authoritative_outbound_min: 1
      authoritative_outbound_max: 3
    author:
      name: Vinai Prakash
      url: https://www.vinaiprakash.com
      same_as:
      - https://www.vinaiprakash.com
      - https://www.youtube.com/@excelchamp
    seo_title:
      brand_suffix: Intellisoft Systems
      append_year: true
    probe:
      rest_ok: true
      seo_plugin: yoast
      seo_meta_rest_writable: true
      seo_plugin_emits_graph: true   # assumed from trainingint's Yoast default; not independently probed, same plugin
      uid_roundtrip_ok: true
      html_renders_ok: true          # verified 2026-10-21: homepage 200, renders normally
      wpcron_reliable: true          # assumed from trainingint's same-host default; revisit if scheduled posts miss
      default_category_id: 357       # "Agentic AI Coding Courses" - matches first cluster (claude-code-codex)
      default_author_id: 2           # vp / Vinai Prakash
      media_max_bytes: 8388608       # assumed same 8MB limit as trainingint (same hosting pattern); not independently probed
      keyword_data: ubersuggest_csv
      probed_at: '2026-10-21'
  trainingint:
    base_url: https://www.trainingint.com
    gsc_property: https://www.trainingint.com/
    wp_api_base: https://www.trainingint.com/wp-json/wp/v2
    ae_api_base: https://www.trainingint.com/wp-json/ae/v1
    app_password_env: WP_TRAININGINT
    cadence:
      per_week: 5
      days:
      - Mon
      - Tue
      - Wed
      - Thu
      - Fri
    link_budget:
      internal_sibling_min: 2
      internal_sibling_max: 3
      primary_course_distinct: 1
      primary_course_occurrences_max: 3
      secondary_course_max: 3
      authoritative_outbound_min: 1
      authoritative_outbound_max: 3
    author:
      name: Vinai Prakash
      url: https://www.vinaiprakash.com
      same_as:
      - https://www.vinaiprakash.com
      - https://www.youtube.com/@excelchamp
    seo_title:
      brand_suffix: Intellisoft Singapore
      append_year: true
    probe:
      rest_ok: true
      seo_plugin: yoast
      seo_meta_rest_writable: false
      seo_plugin_emits_graph: true
      uid_roundtrip_ok: true
      html_renders_ok: true
      wpcron_reliable: true
      default_category_id: 175
      default_author_id: 1
      media_max_bytes: 8388608
      keyword_data: ubersuggest_csv
      probed_at: '2026-05-20'
